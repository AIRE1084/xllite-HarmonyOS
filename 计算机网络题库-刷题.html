<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>计算机网络题库</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--line:#dde3ea;--ink:#17202a;--muted:#667085;
  --accent:#0f766e;--accent-soft:#e9f6f4;--code:#f1f3f5;--blue:#1d4ed8;
  --success:#065f46;--success-bg:#ecfdf5;--success-line:#99f6e4;
  --danger:#991b1b;--danger-bg:#fff7f7;--danger-line:#fecaca;
  --radius:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;line-height:1.5}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px}
main{width:100%;max-width:1100px;margin:0 auto;padding:20px}
h1{margin:0 0 6px;font-size:20px}
.hint{color:var(--muted);line-height:1.55;font-size:13px;margin-bottom:14px}
.progress{height:8px;background:#edf0f3;border-radius:999px;overflow:hidden;margin:12px 0 8px}
.progress span{display:block;height:100%;width:0%;background:var(--accent);transition:width .2s ease}
.meter{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
nav{display:grid;gap:8px;margin-top:16px}
button,.button-link{min-height:36px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;text-decoration:none;padding:0 12px;display:inline-flex;align-items:center;justify-content:center}
nav button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;text-align:left}
nav button.active{border-color:var(--accent);background:var(--accent-soft);color:#064e3b;font-weight:700}
nav small{color:var(--muted);white-space:nowrap}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar button{padding:0 12px}
.danger{color:var(--danger);border-color:var(--danger-line);background:var(--danger-bg)}
.success{color:var(--success);border-color:var(--success-line);background:var(--success-bg)}
.primary{border-color:var(--accent);background:var(--accent);color:#fff}
.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);background:var(--panel);font-size:13px}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:22px}
.question{border-top:1px solid var(--line);padding:16px 0}
.question.correct{background:#f0fdf4;margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px;border-radius:var(--radius)}
.question.wrong{background:#fff7ed;margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px;border-radius:var(--radius)}
.question:first-of-type{border-top:0;padding-top:0}
.stem{margin:0 0 10px;line-height:1.75;color:#263445;white-space:pre-wrap}
.options{display:grid;gap:8px}
label.choice{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fbfcfd;line-height:1.55;cursor:pointer}
label.choice input{margin-top:4px}
textarea,input[type="text"]{width:100%;border:1px solid #b9c3cf;border-radius:6px;padding:8px 9px;color:#111827;background:#fff;font:14px/1.45 Consolas,"Microsoft YaHei",monospace}
textarea{min-height:80px;resize:vertical}
textarea:focus,input[type="text"]:focus{outline:2px solid rgba(15,118,110,.18);border-color:var(--accent)}
.fill-blank{display:inline-block;min-width:120px;width:auto;max-width:100%;vertical-align:middle;margin:0 2px}
.fill-blank input{font-size:14px}
.fill-blank.ok input{border-color:#10b981;background:#f0fdf4}
.fill-blank.bad input{border-color:#f97316;background:#fff7ed}
.answer{display:none;margin-top:10px;padding:8px 10px;border-radius:6px;background:#eef6ff;color:#1f3a5f;line-height:1.6;font-size:14px;white-space:pre-wrap}
.checked .answer,.show-answers .answer{display:block}
.result-mark{display:inline-flex;margin-left:8px;font-size:13px;font-weight:700}
.correct .result-mark{color:#047857}
.wrong .result-mark{color:#c2410c}
.footer-note{color:var(--muted);font-size:13px;line-height:1.6}
.hidden{display:none}
.mob-toggle{display:none}

/* Mobile */
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;left:0;right:0;top:0;height:auto;max-height:80vh;border-right:0;border-bottom:1px solid var(--line);padding:14px;z-index:50;transform:translateY(-100%);transition:transform .25s ease;box-shadow:0 4px 20px rgba(0,0,0,.1)}
  aside.open{transform:translateY(0)}
  main{padding:14px;padding-top:60px}
  h1{font-size:18px}
  .mob-toggle{display:inline-flex;position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));z-index:60;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);align-items:center;justify-content:center;font-size:18px;color:var(--ink)}
  .toolbar{gap:6px}
  .toolbar .group{gap:6px}
  .toolbar button{padding:0 10px;font-size:13px;min-height:36px}
  .pill{font-size:12px;padding:5px 8px}
  section.card{padding:14px}
  h2{font-size:19px}
  .question{padding:14px 0}
  .stem{font-size:15px;line-height:1.7}
  label.choice{padding:12px;font-size:15px;min-height:48px}
  textarea,input[type="text"]{font-size:16px;padding:10px 12px}
  .progress{height:6px}
  nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav button{font-size:13px;padding:10px}
}
@media (max-width:420px){
  .toolbar .pill{font-size:11px;padding:4px 6px}
  .toolbar button{font-size:12px;padding:0 8px}
}
</style>
</head>
<body>
<button class="mob-toggle" id="mobToggle" aria-label="章节导航">☰</button>
<div class="layout">
  <aside id="aside">
    <h1>计算机网络题库</h1>
    <div class="hint">共 41 道题。单选 15 · 判断 10 · 填空 10 · 简答 4 · 应用 2</div>
    <div class="progress"><span id="bar"></span></div>
    <div class="meter"><span id="doneText">0 / 0</span><span id="percentText">0%</span></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="toolbar">
      <div class="group">
        <span class="pill" id="sectionTitle">单选题</span>
        <span class="pill" id="sectionProgress">0 个已答</span>
      </div>
      <div class="group">
        <button id="checkBtn" class="success" type="button">校验对错</button>
        <button id="showBtn" type="button">查看答案</button>
        <button id="exportBtn" type="button">导出作答</button>
        <button id="printBtn" type="button">打印</button>
        <button id="resetBtn" class="danger" type="button">清空</button>
      </div>
    </div>
    <div id="content"></div>
    <p class="footer-note">提示：作答自动保存到本浏览器；手机端左上角 ☰ 切换章节。</p>
  </main>
</div>

{id:"s28",stem:"下列地址中，属于私有IP地址的是。",answer:"B",options:["11.12.13.14","172.20.5.8","202.99.1.2","128.10.1.1"]},
{id:"s29",stem:"TCP滑动窗口机制主要为了解决。",answer:"B",options:["拥塞控制","流量控制","差错检测","路由选择"]},
{id:"s30",stem:"停止等待协议的信道利用率较低，主要原因是。",answer:"C",options:["差错率太高","确认报文过长","信道空闲等待时间占比大","帧首部开销大"]},
{id:"s31",stem:"DNS采用的运输层协议及默认端口是。",answer:"B",options:["TCP 53","UDP 53","TCP 25","UDP 80"]},
{id:"s32",stem:"某主机IP：192.168.5.130，子网掩码255.255.255.128，其所在子网的网络地址是。",answer:"B",options:["192.168.5.0","192.168.5.128","192.168.5.130","192.168.5.255"]},
{id:"s33",stem:"关于TCP拥塞控制的慢启动阶段，正确的是。",answer:"B",options:["拥塞窗口线性增长","拥塞窗口指数增长，直到达到慢启动门限","仅在网络发生拥塞时执行","慢启动门限固定不变"]},
{id:"s34",stem:"下列关于PPP协议说法错误的是。",answer:"C",options:["支持身份认证","既支持同步链路也支持异步链路","采用可靠传输机制保证无差错","由LCP、NCP和认证协议组成"]},
{id:"s35",stem:"路由器转发分组时，依据下列哪一项进行路由查表转发。",answer:"B",options:["目的MAC地址","目的IP地址","源IP地址","源MAC地址"]},

{id:"s38",stem:"网桥能够隔离网络的哪一类流量。",answer:"B",options:["广播域流量","冲突域流量","路由转发流量","应用层会话流量"]}
]},

{id:"j23",stem:"停止等待协议属于可靠传输协议，不需要确认机制即可实现可靠传输。",answer:"错误"},
{id:"j24",stem:"子网掩码255.255.255.192划分的子网，每个子网可用主机数为64。",answer:"错误"},
{id:"j25",stem:"TCP慢启动阶段拥塞窗口呈线性增长，进入拥塞避免后变为指数增长。",answer:"错误"},
{id:"j26",stem:"PPP协议具备差错恢复、流量控制和可靠传输的完整机制。",answer:"错误"}
]},

{id:"f07",stem:"香农公式中，信道极限信息传输速率与__1__和__2__有关。",blanks:2,answer:["信道带宽","信噪比"]},
{id:"f08",stem:"以太网采用的介质访问控制方法是__1__。",blanks:1,answer:["CSMA/CD"]},

{id:"f13",stem:"路由器工作在__1__层，依据__2__进行分组转发。",blanks:2,answer:["网络","目的IP地址"]},
{id:"f14",stem:"DNS在绝大多数情况下运输层采用__1__协议。",blanks:1,answer:["UDP"]},
{id:"f15",stem:"数据链路层PPP协议中，负责链路配置与测试的协议是__1__。",blanks:1,answer:["LCP"]}
]},
{id:"essay",title:"简答题",type:"essay",items:[
{id:"e1",stem:"简述TCP与UDP协议的主要区别，以及各自适用的应用场景。",reference:"【连接特性】TCP 面向连接，通信前需建立连接；UDP 无连接，无需建立连接。（1分）\n【可靠性】TCP 可靠传输，具备确认、重传、流量与拥塞控制；UDP 不可靠，仅提供简单校验。（1分）\n【开销与速率】TCP 首部开销大，传输速率偏低；UDP 首部简洁，传输效率高、时延小。（1分）\n【应用场景】TCP 适用于文件传输、网页浏览、邮件等对可靠性要求高的业务；UDP 适用于视频直播、语音通话、游戏、DNS 查询等追求实时性的业务。（2分）"},
{id:"e2",stem:"简述交换机与路由器的工作层次、转发依据及核心作用区别。",reference:"【工作层次】交换机工作在数据链路层；路由器工作在网络层。（1分）\n【转发依据】交换机依据 MAC 地址转发数据帧；路由器依据 IP 地址转发分组。（1分）\n【域隔离能力】交换机可隔离冲突域，无法隔离广播域；路由器可隔离广播域，划分不同网络网段。（2分）\n【主要作用】交换机用于局域网内部主机高速通信；路由器实现不同网段、不同网络之间的互联与路由寻址。（1分）"},
{id:"e3",stem:"简述停止等待协议的工作原理，并说明该协议存在的主要缺点。",reference:"【工作原理】发送方每发送一帧数据后立即停止发送，等待接收方返回确认 ACK 报文；（2分）收到确认后再发送下一帧；（1分）若超时未收到确认，则判定帧丢失，执行超时重传。\n【主要缺点】信道利用率极低，大部分时间信道处于空闲等待状态；（1分）仅适合低速率、短时延的简单通信场景，大批量数据传输效率很差。（1分）"},
{id:"e4",stem:"简述划分子网的目的与子网划分带来的好处。",reference:"【划分子网目的】合理利用 IPv4 有限地址资源，对大型网络进行逻辑分段管理。（1分）\n【主要好处】\n① 缩小广播范围，减少网络内广播风暴带来的流量消耗；（1分）\n② 实现网络分层管理，方便部门、区域独立管控网络；（1分）\n③ 节约公网 IP 地址，提升地址使用效率；（1分）\n④ 提升网络安全性，不同子网之间可做访问隔离。（1分）"}
]},
{id:"calc",title:"应用题",type:"calc",items:[
{id:"c5",stem:"某企业拥有网络地址块192.168.10.0/24，现需划分6个子网，每个子网内至少容纳25台主机，内网路由器采用RIP动态路由协议，广域网链路采用PPP协议封装传输。内网主机通过浏览器访问外网Web站点，全程使用TCP/IP协议簇完成通信。请完成下列问题：\n（1）计算合理子网掩码、划分出6个子网，写出每个子网网络地址、可用主机IP范围。\n（2）PPP协议采用字节填充法实现透明传输，原始发送数据十六进制：7E 5D 7E 7D，写出字节填充后数据序列，并简述PPP字节填充规则。\n（3）简述内网主机访问外网Web服务器时，ARP寻址+TCP三次握手+HTTP请求完整通信流程。",reference:"【(1) 子网划分 5分】\n需求：每子网至少 25 台主机，主机位最少：2^5-2=30≥25，主机位占 5 位；子网位：8-5=3 位，可划分 2^3=8 个子网，满足 6 个子网需求；子网掩码：255.255.255.224。\n子网 1：192.168.10.0 可用：192.168.10.1-192.168.10.30\n子网 2：192.168.10.32 可用：192.168.10.33-192.168.10.62\n子网 3：192.168.10.64 可用：192.168.10.65-192.168.10.94\n子网 4：192.168.10.96 可用：192.168.10.97-192.168.10.126\n子网 5：192.168.10.128 可用：192.168.10.129-192.168.10.158\n子网 6：192.168.10.160 可用：192.168.10.161-192.168.10.190\n\n【(2) PPP 字节填充 5分】\n填充规则：\n① 帧起始/结束标志 0x7E → 替换为 0x7D 0x5E\n② 转义字符 0x7D → 替换为 0x7D 0x5D\n③ 其余字符不变\n原始：7E 5D 7E 7D\n填充后：7D 5E 5D 7D 5E 7D 5D\n\n【(3) 通信完整流程 5分】\n① 主机先查询本地 DNS 缓存，无结果则向本地 DNS 服务器发起递归域名解析，获取网站服务器 IP；\n② 主机判断目标 IP 不在同一内网，发送 ARP 请求获取网关路由器 MAC 地址；\n③ 主机与 Web 服务器之间完成 TCP 三次握手，建立可靠连接；\n④ 连接建立完成后，主机发送 HTTP 请求报文；\n⑤ 服务器接收请求，返回 HTTP 响应报文，传输网页数据，通信结束后可执行四次挥手断开连接。"},
{id:"c6",stem:"某小型企业内网规划网段为192.168.3.0/24，企业仅申请到一个公网IP地址：203.10.6.8，企业出口路由器开启PAT端口多路复用NAT功能实现全体内网主机上网。内网主机通过浏览器访问外网服务器IP：112.56.22.99。请完成下列问题：\n（1）写出私有IP地址三大网段范围，并简述静态NAT、动态NAT、PAT三种NAT方式核心区别。\n（2）结合本题场景，详细描述内网主机主动访问外网服务器时，数据包出内网、回传内网两次NAT地址与端口转换全过程。\n（3）简述NAT技术的主要优点，以及NAT存在的局限性与缺点。",reference:"【(1) 私有IP网段+三种NAT区别 5分】\n私有 IP 地址范围：\nA 类私有：10.0.0.0-10.255.255.255\nB 类私有：172.16.0.0-172.31.255.255\nC 类私有：192.168.0.0-192.168.255.255\n\n三种 NAT 区别：\n① 静态 NAT：一对一固定映射，内网私有 IP 永久绑定指定公网 IP，适合服务器发布外网。\n② 动态 NAT：多对多映射，从公网 IP 地址池自动分配空闲公网 IP，无端口映射，同一时间一一对应。\n③ PAT 端口多路复用：多对一映射，所有内网主机共用同一个公网 IP，依靠不同源端口号区分不同主机流量，是家庭、企业最常用方式。\n\n【(2) PAT 双向转换 5分】\n设定：内网主机 IP 192.168.3.10，源端口 50010；外网服务器 112.56.22.99，目的端口 80；路由器公网 IP 203.10.6.8。\n外出（内网→外网）：源 IP=192.168.3.10 → 替换为 203.10.6.8，更换外网唯一端口，记录映射表，目的 IP/端口保持不变，转发至互联网。\n回传（外网→内网）：查询 NAT 映射表，将目的 IP 改回内网主机私有 IP，目的端口还原为主机原端口，转发至内网主机。\n\n【(3) NAT 优缺点 5分】\n优点：\n① 有效节约稀缺的公网 IPv4 地址；\n② 隐藏内网真实主机 IP，提升内网基础安全性；\n③ 内网主机地址可自由规划，组网灵活。\n缺点：\n① 破坏端到端通信模式，部分应用难以穿透；\n② 增加路由器转发开销与时延；\n③ 无法使用部分内嵌 IP 地址的应用层协议；\n④ 不利于外网对内网设备进行远程管理与调试。"}
]}
];

const state=JSON.parse(localStorage.getItem(STORE_KEY)||"{}");
let active=0,checkedMode=false,showAnswers=false;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function norm(v){return String(v||'').replace(/[；;]\s*$/g,'').replace(/\s+/g,'').toLowerCase()}
function isDone(id){return Boolean((state[id]||'').toString().trim()||(Array.isArray(state[id])&&state[id].some(x=>String(x||'').trim())))}

function statusClass(item){
  if(!checkedMode)return "";
  if(item.type==="essay"||item.type==="calc")return "";
  return isCorrect(item)?"correct":"wrong";
}
function resultMark(item){
  if(!checkedMode||item.type==="essay"||item.type==="calc")return "";
  if(!isDone(item.id))return '<span class="result-mark">未答</span>';
  return isCorrect(item)?'<span class="result-mark">正确</span>':'<span class="result-mark">错误</span>';
}
function isCorrect(item){
  const u=state[item.id];
  if(u==null)return false;
  if(item.type==="single")return String(u).trim().toUpperCase()===item.answer;
  if(item.type==="judge")return u===item.answer;
  if(item.type==="fill")return item.answer.every((a,i)=>norm((Array.isArray(u)?u[i]:u))===norm(a));
  return false;
}
function answerHtml(item){
  if(item.type==="single"||item.type==="judge")return `<div class="answer">标准答案：${esc(item.answer)}</div>`;
  if(item.type==="fill"){
    const u=Array.isArray(state[item.id])?state[item.id]:[];
    const rows=item.answer.map((a,i)=>{
      const ok=norm(u[i])===norm(a);
      return `空 ${i+1}：<b>${ok?"✓":"✗"}</b> ${esc(ok?a:`你的：${esc(u[i]||'(空)')} / 正确：${esc(a)}`)}`;
    }).join("<br>");
    return `<div class="answer">${rows}</div>`;
  }
  if(item.type==="essay"||item.type==="calc")return `<div class="answer"><b>参考答案：</b><br>${esc(item.reference)}</div>`;
  return "";
}

function renderSingle(item,idx){
  return `<div class="question ${statusClass(item)}">
    <p class="stem">${idx+1}. ${esc(item.stem).replace(/\n/g,"<br>")}${resultMark(item)}</p>
    <div class="options">${item.options.map((o,i)=>{
      const L=String.fromCharCode(65+i);
      const ck=state[item.id]===L?"checked":"";
      return `<label class="choice"><input type="radio" name="${item.id}" value="${L}" data-id="${item.id}" ${ck}><span>${L}. ${esc(o)}</span></label>`;
    }).join("")}</div>
    ${answerHtml(item)}
  </div>`;
}
function renderJudge(item,idx){
  return `<div class="question ${statusClass(item)}">
    <p class="stem">${idx+1}. ${esc(item.stem).replace(/\n/g,"<br>")}${resultMark(item)}</p>
    <div class="options">${["正确","错误"].map(o=>{
      const ck=state[item.id]===o?"checked":"";
      return `<label class="choice"><input type="radio" name="${item.id}" value="${o}" data-id="${item.id}" ${ck}><span>${o}</span></label>`;
    }).join("")}</div>
    ${answerHtml(item)}
  </div>`;
}
function renderFill(item,idx){
  const u=Array.isArray(state[item.id])?state[item.id]:[];
  const html=esc(item.stem).replace(/__(\d+)__/g,(_,n)=>{
    const i=Number(n),v=u[i-1]||"",cls=checkedMode?(norm(v)===norm(item.answer[i-1])?"ok":"bad"):"";
    return `<span class="fill-blank ${cls}"><input type="text" data-id="${item.id}" data-blank="${i}" value="${esc(v)}" spellcheck="false"></span>`;
  });
  return `<div class="question">
    <p class="stem">${idx+1}. ${html}</p>
    ${answerHtml(item)}
  </div>`;
}
function renderEssay(item,idx){
  const u=state[item.id]||"";
  return `<div class="question">
    <p class="stem">${idx+1}. ${esc(item.stem).replace(/\n/g,"<br>")}</p>
    <textarea data-id="${item.id}" spellcheck="false" placeholder="在这里输入答案...">${esc(u)}</textarea>
    ${answerHtml(item)}
  </div>`;
}

function renderContent(){
  const sec=sections[active];
  document.getElementById("sectionTitle").textContent=sec.title;
  let body="";
  if(sec.type==="single")body=sec.items.map((it,i)=>renderSingle(it,i)).join("");
  else if(sec.type==="judge")body=sec.items.map((it,i)=>renderJudge(it,i)).join("");
  else if(sec.type==="fill")body=sec.items.map((it,i)=>renderFill(it,i)).join("");
  else if(sec.type==="essay"||sec.type==="calc")body=sec.items.map((it,i)=>renderEssay(it,i)).join("");
  document.getElementById("content").innerHTML=`<section class="card ${showAnswers?"show-answers":""} ${checkedMode?"checked":""}"><h2>${sec.title}</h2>${body}</section>`;
  document.querySelectorAll("[data-id]").forEach(inp=>{
    inp.addEventListener("input",saveFromInput);
    inp.addEventListener("change",saveFromInput);
  });
  updateProgress();
}

function saveFromInput(e){
  const t=e.target,id=t.dataset.id;
  if(t.dataset.blank!==undefined){
    const i=Number(t.dataset.blank);
    const arr=Array.isArray(state[id])?[...state[id]]:[];
    arr[i-1]=t.value;
    state[id]=arr;
  } else {
    state[id]=t.value;
  }
  localStorage.setItem(STORE_KEY,JSON.stringify(state));
  updateProgress();
  renderNav();
}

function allIds(){return sections.flatMap(s=>s.items.map(it=>it.id))}
function updateProgress(){
  const ids=allIds();
  const done=ids.filter(isDone).length;
  const pct=ids.length?Math.round(done/ids.length*100):0;
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("doneText").textContent=`${done} / ${ids.length}`;
  document.getElementById("percentText").textContent=pct+"%";
  const secIds=sections[active].items.map(it=>it.id);
  document.getElementById("sectionProgress").textContent=`${secIds.filter(isDone).length} 个已答`;
}

function renderNav(){
  document.getElementById("nav").innerHTML=sections.map((s,i)=>{
    const ids=s.items.map(it=>it.id);
    const done=ids.filter(isDone).length;
    return `<button type="button" class="${i===active?"active":""}" data-go="${i}">
      <span>${s.title}</span><small>${done}/${ids.length}</small>
    </button>`;
  }).join("");
}

function go(i){
  active=i;renderNav();renderContent();
  document.getElementById("aside").classList.remove("open");
}

document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-go]");
  if(b)go(Number(b.dataset.go));
});
document.getElementById("mobToggle").addEventListener("click",()=>{
  document.getElementById("aside").classList.toggle("open");
});
document.getElementById("checkBtn").addEventListener("click",()=>{checkedMode=true;renderContent()});
document.getElementById("showBtn").addEventListener("click",()=>{
  showAnswers=!showAnswers;
  document.getElementById("showBtn").textContent=showAnswers?"隐藏答案":"查看答案";
  renderContent();
});
document.getElementById("exportBtn").addEventListener("click",()=>{
  const lines=["计算机网络题库作答",""];
  sections.forEach(s=>{
    lines.push(s.title);
    s.items.forEach((it,i)=>lines.push(`${i+1}. ${(Array.isArray(state[it.id])?state[it.id].join(" | "):state[it.id])||""}`));
    lines.push("");
  });
  const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="计算机网络题库作答.txt";a.click();URL.revokeObjectURL(url);
});
document.getElementById("printBtn").addEventListener("click",()=>window.print());
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("清空当前浏览器里的全部作答？"))return;
  Object.keys(state).forEach(k=>delete state[k]);
  localStorage.removeItem(STORE_KEY);
  renderNav();renderContent();
});

renderNav();
renderContent();
</script>
</body>
</html>
