<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>支付确认浮层 · 动效评审</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#17202d;background:#eef1f6}*{box-sizing:border-box}body{margin:0;padding:32px 20px}main{max-width:900px;margin:auto;display:flex;align-items:center;gap:48px}.phone{position:relative;width:360px;height:720px;flex-shrink:0;background:#f6f8fc;border:1px solid #dfe4ed;border-radius:28px;padding:26px 20px;overflow:hidden}.top{display:flex;justify-content:space-between;font-weight:600}.title{margin:32px 0 24px;font-size:26px}.card{background:white;border-radius:20px;padding:22px;margin-bottom:20px}.code{height:220px;display:grid;place-items:center;border-radius:14px;background:repeating-linear-gradient(135deg,#f1f3f6 0 14px,#f7f8fa 14px 28px);color:#858d99;margin-top:20px}.row{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid #edf0f5}.row:last-child{border-bottom:0}.hint{font-size:12px;color:#7b8492}.feedback{position:absolute;top:76px;left:50%;width:112px;height:112px;margin-left:-56px;border-radius:28px;background:#292c30;box-shadow:0 8px 24px #11182720;display:grid;place-items:center;opacity:0;pointer-events:none}.feedback svg{width:78px;height:78px;fill:none;stroke:#58bf70;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.ring{stroke-dasharray:214;stroke-dashoffset:214;transform:rotate(-90deg);transform-origin:45px 45px}.check{stroke-dasharray:55;stroke-dashoffset:55}.play{animation:surface 1900ms ease both}.play .ring{animation:draw 400ms 140ms ease-out both}.play .check{animation:draw 230ms 510ms ease-out both}@keyframes draw{to{stroke-dashoffset:0}}@keyframes surface{0%{opacity:0;transform:translateY(-6px) scale(.94)}12%,82%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-3px) scale(.98)}}.reduced.play{animation:fade 1600ms linear both}.reduced.play .ring,.reduced.play .check{animation:none;stroke-dashoffset:0}@keyframes fade{0%,100%{opacity:0}8%,88%{opacity:1}}aside{max-width:380px}h1{font-size:25px}p{line-height:1.8;color:#596474}button{background:#315ed7;color:white;border:0;border-radius:12px;padding:13px 24px;font-size:16px;cursor:pointer}label{display:block;margin:20px 0}#state{min-height:24px;font-size:14px;color:#536174}@media(max-width:740px){main{flex-direction:column;gap:20px}.phone{width:min(360px,100%)}aside{order:-1}}@media(prefers-reduced-motion:reduce){.play{animation:fade 1600ms linear both}.play .ring,.play .check{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body><main>
<section class="phone" aria-label="校园卡示意页面">
<div class="top"><span>‹</span><span>校园卡</span><span>···</span></div>
<h2 class="title">付款码</h2><div class="card"><strong>校园卡</strong><div class="code">示意占位 · 非付款码</div></div>
<h3>交易记录</h3><div class="card"><div class="row"><span>食堂消费</span><span>−12.00</span></div><div class="row"><span>超市消费</span><span>−8.50</span></div><p class="hint">以上为设计示例，无真实交易</p></div>
<div class="feedback" id="feedback" aria-hidden="true"><svg viewBox="0 0 90 90"><circle class="ring" cx="45" cy="45" r="34"/><path class="check" d="M29 45 L40 56 L62 33"/></svg></div>
</section>
<aside><h1>支付确认浮层</h1><p>深灰圆角方块，绿色圆环后绘制对勾，短暂停留再淡出。原页面始终保留，不跳转、不加全屏遮罩。</p><button id="replay" type="button">播放预览</button><label><input id="reduce" type="checkbox"> 减少动效：仅静态勾选与淡入淡出</label><div id="state" role="status" aria-live="polite">点击播放，评审节奏与尺寸。</div><p class="hint">本页仅为待确认的设计原型，不调用支付、通知、小艺或设备认证。不播放音效、不触发震动。正式实现仅由服务端确认的交易成功触发一次。</p><p class="hint">建议时序：140ms 后开始描环，510ms 后描勾，总长约1.9秒；均为设计参数，不是系统原版参数。</p></aside>
</main><script>
const panel=document.getElementById('feedback');
const reduce=document.getElementById('reduce');
const state=document.getElementById('state');
const replay=document.getElementById('replay');
function play(){panel.classList.remove('play');panel.classList.toggle('reduced',reduce.checked);void panel.offsetWidth;panel.classList.add('play');state.textContent='正在播放示例确认反馈，无真实交易。';}
replay.addEventListener('click',play);
reduce.addEventListener('change',play);
panel.addEventListener('animationend',event=>{if(event.target===panel){state.textContent='播放结束，可重播。';}});
</script></body></html>
