<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - Volc AI Proxy</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <h1>Volc AI Proxy</h1>
    <p>本地中转站管理后台</p>
    <form id="loginForm">
      <label>用户名<input id="username" value="admin" autocomplete="username" /></label>
      <label>密码<input id="password" value="admin123" type="password" autocomplete="current-password" /></label>
      <button type="submit">登录</button>
      <div id="error" class="error"></div>
    </form>
  </main>
  <script>
    document.querySelector('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username.value, password: password.value }) });
      const data = await res.json();
      if (data.ok) location.href = '/admin';
      else error.textContent = data.error || '登录失败';
    });
  </script>
</body>
</html>
