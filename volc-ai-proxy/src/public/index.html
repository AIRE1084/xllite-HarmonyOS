<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volc AI Proxy 管理后台</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="topbar"><div><h1>Volc AI Proxy</h1><span>火山引擎 Ark 本地中转站</span></div><button id="logoutBtn">退出</button></header>
  <main class="container">
    <section class="cards">
      <article><b id="totalUsers">0</b><span>用户数</span></article>
      <article><b id="todayRequests">0</b><span>今日请求</span></article>
      <article><b id="weeklyRequests">0</b><span>本周请求</span></article>
      <article><b id="todayErrors">0</b><span>今日错误</span></article>
      <article><b id="avgLatencyMs">0ms</b><span>平均耗时</span></article>
    </section>

    <section class="panel">
      <div class="panel-title"><h2>状态检查</h2><button id="checkStatusBtn">实时检查</button></div>
      <pre id="statusBox">等待检查...</pre>
    </section>

    <section class="panel">
      <div class="panel-title"><h2>用户管理</h2><button id="createUserBtn">创建用户</button></div>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>名称</th><th>API Key</th><th>5小时</th><th>日限</th><th>周限</th><th>模式</th><th>状态</th><th>操作</th></tr></thead><tbody id="usersBody"></tbody></table></div>
    </section>

    <section class="panel">
      <div class="panel-title"><h2>调用日志</h2><button id="refreshLogsBtn">刷新</button></div>
      <div class="table-wrap"><table><thead><tr><th>时间</th><th>用户</th><th>模型</th><th>状态</th><th>HTTP</th><th>Token</th><th>耗时</th><th>错误</th></tr></thead><tbody id="logsBody"></tbody></table></div>
    </section>
  </main>

  <dialog id="userDialog">
    <form method="dialog" id="userForm">
      <h3>创建用户</h3>
      <label>名称<input name="name" required value="test-user" /></label>
      <label>API Key（留空自动生成）<input name="api_key" /></label>
      <label>5小时限制<input name="five_hour_limit" type="number" value="50" /></label>
      <label>日限制<input name="daily_limit" type="number" value="100" /></label>
      <label>周限制<input name="weekly_limit" type="number" value="500" /></label>
      <label>计费模式<select name="quota_mode"><option value="requests">请求次数</option><option value="tokens">Token</option></select></label>
      <label>模型白名单（逗号分隔，可空）<input name="model_allowlist" placeholder="doubao-lite-4k,doubao-pro-32k" /></label>
      <menu><button value="cancel">取消</button><button id="saveUserBtn" value="default">保存</button></menu>
    </form>
  </dialog>

  <script src="/assets/app.js"></script>
</body>
</html>
