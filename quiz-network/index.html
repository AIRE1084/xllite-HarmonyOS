<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>计算机网络刷题 v2 · 备考闭环</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<style>
/* ============================================================
   设计令牌（亮 / 暗双主题）
   ============================================================ */
:root {
  --bg:        #f5f7fa;
  --panel:     #ffffff;
  --line:      #e3e7ee;
  --ink:       #1a2230;
  --muted:     #6b7585;
  --accent:    #0f766e;
  --accent-2:  #0ea5a4;
  --soft:      #e6f4f1;
  --code:      #f1f3f5;
  --blue:      #1d4ed8;
  --blue-bg:   #eef4ff;
  --green:     #10b981;
  --green-bg:  #ecfdf5;
  --red:       #dc2626;
  --red-bg:    #fff1f2;
  --orange:    #d97706;
  --orange-bg: #fff7ed;
  --amber:     #f59e0b;
  --purple:    #7c3aed;
  --purple-bg: #f3e8ff;
  --shadow:    0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.04);
  --radius:    10px;
  --radius-sm: 6px;
  --font:      "PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --font-mono: ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Courier New",monospace;
}
[data-theme="dark"] {
  --bg:        #0e1116;
  --panel:     #161b22;
  --line:      #2a313c;
  --ink:       #e6edf3;
  --muted:     #8b95a4;
  --accent:    #2dd4bf;
  --accent-2:  #5eead4;
  --soft:      #0d2a26;
  --code:      #1c2128;
  --blue:      #7aa2f7;
  --blue-bg:   #1a2438;
  --green:     #34d399;
  --green-bg:  #0e2620;
  --red:       #f87171;
  --red-bg:    #2a1717;
  --orange:    #fb923c;
  --orange-bg: #2a1e10;
  --amber:     #fbbf24;
  --purple:    #a78bfa;
  --purple-bg: #251c33;
  --shadow:    0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.4);
}
[data-fontsize="sm"] { --fs-base: 14px; }
[data-fontsize="md"] { --fs-base: 15px; }
[data-fontsize="lg"] { --fs-base: 17px; }
:root { --fs-base: 15px; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-base);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ============================================================
   总体布局
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  min-height: 100vh;
}
aside {
  position: sticky; top: 0; height: 100vh; overflow: auto;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 16px 14px 80px;
}
main {
  width: 100%; max-width: 1080px; margin: 0 auto; padding: 22px 22px 60px;
}

/* ============================================================
   侧栏
   ============================================================ */
.brand {
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 16px; margin-bottom: 12px;
}
.brand .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
.brand .ver {
  margin-left: auto; font-size: 11px; padding: 2px 6px;
  background: var(--soft); color: var(--accent); border-radius: 4px; font-weight: 600;
}
.session-pill {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 10px; margin-bottom: 8px;
  background: var(--bg);
}
.session-pill strong { color: var(--ink); font-weight: 600; }
.due-pill {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--muted);
  border: 1px solid var(--accent); border-radius: 999px;
  padding: 4px 10px; margin-bottom: 12px;
  background: var(--soft);
  cursor: pointer;
}
.due-pill:hover { background: var(--accent); color: #fff; }
.due-pill:hover strong { color: #fff; }
.due-pill strong { color: var(--accent); font-weight: 700; }

.section-title {
  font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); margin: 14px 0 8px;
}
.mode-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
}
.mode-btn {
  display: flex; flex-direction: column; align-items: flex-start;
  padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg); color: var(--ink); cursor: pointer; text-align: left;
  font: inherit; font-size: 13px; transition: .12s;
}
.mode-btn:hover { border-color: var(--accent); }
.mode-btn.active {
  background: var(--soft); border-color: var(--accent); color: var(--accent);
  font-weight: 600;
}
.mode-btn small { color: var(--muted); font-size: 11px; margin-top: 1px; }
.mode-btn.active small { color: var(--accent); }

.filter-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;
}
.filter-row select, .filter-row input {
  width: 100%; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: var(--radius-sm); background: var(--panel); color: var(--ink);
  font: inherit; font-size: 13px;
}

.progress {
  height: 8px; background: var(--bg); border-radius: 999px;
  overflow: hidden; margin: 8px 0 4px;
  border: 1px solid var(--line);
}
.progress span {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .25s ease;
}
.meter {
  display: flex; justify-content: space-between; color: var(--muted);
  font-size: 12px; margin-bottom: 8px;
}
.meter strong { color: var(--ink); font-weight: 600; }

.qnav {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
  gap: 4px; margin-top: 6px;
}
.qnav button {
  height: 32px; padding: 0; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); border-radius: 4px;
  font: inherit; font-size: 10px; cursor: pointer; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  line-height: 1.1; transition: .12s;
}
.qnav button .qno  { font-weight: 600; font-size: 11px; }
.qnav button .qid  { color: var(--muted); font-size: 9px; }
.qnav button:hover { border-color: var(--accent); }
.qnav button.cur {
  outline: 2px solid var(--accent); outline-offset: 1px; z-index: 1;
}
.qnav button.done { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.qnav button.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.qnav button.due   { background: var(--orange-bg); border-color: var(--orange); color: var(--orange); }
.qnav button.fav::after {
  content: ""; position: absolute; top: -3px; right: -3px;
  width: 8px; height: 8px; background: var(--amber); border-radius: 50%;
  border: 2px solid var(--panel);
}
.qnav button.review::before {
  content: "!"; position: absolute; top: -4px; left: -4px;
  width: 12px; height: 12px; background: var(--orange); color: #fff;
  border-radius: 50%; font-size: 9px; line-height: 12px; text-align: center;
  border: 1px solid var(--panel);
}

.legend {
  display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 11px;
  color: var(--muted); margin-top: 8px;
}
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i {
  display: inline-block; width: 10px; height: 10px; border-radius: 2px;
  border: 1px solid var(--line);
}
.legend .lg-ok   { background: var(--green-bg); border-color: var(--green); }
.legend .lg-bad  { background: var(--red-bg);   border-color: var(--red); }
.legend .lg-due  { background: var(--orange-bg);border-color: var(--orange); }
.legend .lg-fav  { background: var(--amber); }

.side-actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 14px;
}
.side-actions button {
  padding: 7px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--panel); color: var(--ink); cursor: pointer; font: inherit; font-size: 12px;
}
.side-actions button:hover { border-color: var(--accent); color: var(--accent); }

/* ============================================================
   主区
   ============================================================ */
.toolbar {
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
}
.toolbar .group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.toolbar .info {
  font-size: 13px; color: var(--muted);
}
.toolbar .info strong { color: var(--ink); }

button, .btn {
  min-height: 34px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--panel); color: var(--ink); cursor: pointer;
  font: inherit; font-size: 13px; line-height: 1;
  display: inline-flex; align-items: center; gap: 6px;
  transition: .12s;
}
button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
button.success { background: var(--green); border-color: var(--green); color: #fff; }
button.danger  { color: var(--red); border-color: #fecaca; background: var(--red-bg); }
button.warn    { color: var(--orange); border-color: #fde6c8; background: var(--orange-bg); }
button.ghost   { background: transparent; }
button.tiny    { min-height: 24px; padding: 0 8px; font-size: 11px; }
.icon-btn { width: 34px; padding: 0; justify-content: center; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px;
  font-size: 12px; color: var(--muted); background: var(--panel);
}
.tag.cat { color: var(--accent); border-color: var(--accent); background: var(--soft); }
.tag.diff-1 { color: var(--green); border-color: var(--green); background: var(--green-bg); }
.tag.diff-2 { color: var(--orange); border-color: var(--orange); background: var(--orange-bg); }
.tag.diff-3 { color: var(--red); border-color: var(--red); background: var(--red-bg); }
.tag.type-single { color: var(--blue);    border-color: var(--blue);    background: var(--blue-bg); }
.tag.type-tf     { color: var(--accent);  border-color: var(--accent);  background: var(--soft); }
.tag.type-fill   { color: var(--amber);   border-color: var(--amber);   background: #fff8e6; }
.tag.type-short  { color: var(--purple);  border-color: var(--purple);  background: var(--purple-bg); }
.tag.type-comp   { color: var(--red);     border-color: var(--red);     background: var(--red-bg); }
.tag.type-multi  { color: var(--blue);    border-color: var(--blue);    background: var(--blue-bg); }
.tag.type-sort   { color: var(--orange);  border-color: var(--orange);  background: var(--orange-bg); }
.tag.type-match  { color: var(--accent);  border-color: var(--accent);  background: var(--soft); }
[data-theme="dark"] .tag.type-fill { background: #2a2410; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.card h2 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
.card h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }

.stem {
  line-height: 1.85; font-size: 16px; color: var(--ink);
  margin: 8px 0 14px;
  white-space: pre-wrap; word-wrap: break-word;
}

.options { display: grid; gap: 8px; }
.options label {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg); cursor: pointer; line-height: 1.6;
  transition: .12s;
}
.options label:hover { border-color: var(--accent); }
.options input { margin-top: 4px; flex: none; }
.options label.sel { border-color: var(--accent); background: var(--soft); }
.options label.correct { border-color: var(--green); background: var(--green-bg); color: var(--ink); }
.options label.wrong-sel { border-color: var(--red); background: var(--red-bg); }
.options label.miss-correct { border-color: var(--orange); background: var(--orange-bg); }
.options .k {
  flex: none; min-width: 22px; height: 22px; padding: 0 4px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  font-size: 12px; font-weight: 600; color: var(--muted);
}
.options label.correct .k { background: var(--green); border-color: var(--green); color: #fff; }
.options label.wrong-sel .k { background: var(--red); border-color: var(--red); color: #fff; }
.options label.sel .k { background: var(--accent); border-color: var(--accent); color: #fff; }

.tf-row { display: flex; gap: 10px; flex-wrap: wrap; }
.tf-row button {
  flex: 1; min-width: 120px; padding: 12px 16px; font-size: 15px; font-weight: 600;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.tf-row button.sel { border-color: var(--accent); background: var(--soft); color: var(--accent); }
.tf-row button.correct { border-color: var(--green); background: var(--green-bg); color: var(--ink); }
.tf-row button.wrong-sel { border-color: var(--red); background: var(--red-bg); color: var(--ink); }

.fill-row { display: grid; gap: 10px; }
.fill-row .item { display: flex; flex-direction: column; gap: 4px; }
.fill-row label { font-size: 12px; color: var(--muted); }
.fill-row input {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--panel); color: var(--ink);
  font: 14px/1.4 var(--font-mono);
}
.fill-row input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.fill-row input.ok  { border-color: var(--green); background: var(--green-bg); }
.fill-row input.bad { border-color: var(--red); background: var(--red-bg); }

textarea, input.text {
  width: 100%; min-height: 88px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--panel); color: var(--ink);
  font: 14px/1.6 var(--font-mono);
  resize: vertical;
}
textarea:focus, input.text:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.note-box {
  margin-top: 8px; padding: 10px 12px;
  background: var(--blue-bg); color: var(--blue);
  border-left: 3px solid var(--blue); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 13px; line-height: 1.6;
}
.answer-box {
  margin-top: 14px; padding: 12px 14px;
  background: var(--blue-bg); color: var(--ink);
  border-left: 4px solid var(--blue); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  white-space: pre-wrap; line-height: 1.7;
}
.answer-box h4 { margin: 0 0 6px; color: var(--blue); font-size: 14px; }
.points-list { margin: 6px 0 0; padding-left: 18px; }
.points-list li { margin: 2px 0; line-height: 1.65; }
.points-list li .sc {
  display: inline-block; min-width: 24px; padding: 0 6px; margin-right: 6px;
  background: var(--accent); color: #fff; font-size: 11px; text-align: center;
  border-radius: 999px; vertical-align: 1px;
}

.parts-list { display: grid; gap: 14px; margin-top: 6px; }
.part {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; background: var(--bg);
}
.part h4 { margin: 0 0 6px; font-size: 14px; color: var(--accent); }
.part .part-stem { line-height: 1.7; font-size: 14px; margin-bottom: 6px; white-space: pre-wrap; }
.part .part-score { float: right; font-size: 12px; color: var(--muted); }

/* 排序题 */
.sort-list { display: grid; gap: 8px; margin-top: 6px; }
.sort-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg); cursor: grab;
  transition: .12s;
}
.sort-item.dragging { opacity: .4; }
.sort-item.drag-over { border-color: var(--accent); background: var(--soft); }
.sort-item.correct-pos { border-color: var(--green); background: var(--green-bg); }
.sort-item.wrong-pos  { border-color: var(--red); background: var(--red-bg); }
.sort-item .drag-handle {
  color: var(--muted); cursor: grab; font-size: 16px; user-select: none;
}
.sort-item .seq {
  width: 24px; height: 24px; border-radius: 4px;
  background: var(--panel); border: 1px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: var(--muted);
}
.sort-item.correct-pos .seq { background: var(--green); border-color: var(--green); color: #fff; }
.sort-item.wrong-pos .seq   { background: var(--red); border-color: var(--red); color: #fff; }
.sort-item .updown { display: flex; flex-direction: column; gap: 2px; margin-left: auto; }
.sort-item .updown button { min-height: 18px; padding: 0 4px; font-size: 10px; line-height: 1; }

/* 连线题 */
.match-wrap { display: grid; grid-template-columns: 1fr 40px 1fr; gap: 10px; margin-top: 8px; align-items: start; }
.match-col { display: grid; gap: 8px; }
.match-cell {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg); cursor: pointer; transition: .12s;
}
.match-cell:hover { border-color: var(--accent); }
.match-cell.sel { border-color: var(--accent); background: var(--soft); }
.match-cell.matched { border-color: var(--green); background: var(--green-bg); }
.match-cell.matched-wrong { border-color: var(--red); background: var(--red-bg); }
.match-cell .badge {
  width: 22px; height: 22px; border-radius: 4px;
  background: var(--panel); border: 1px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--muted); font-weight: 600;
}
.match-lines {
  position: relative; min-height: 100px;
}
.match-lines svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.match-lines path { stroke: var(--accent); stroke-width: 2; fill: none; }
.match-lines path.wrong { stroke: var(--red); stroke-dasharray: 4 3; }
.match-status { margin-top: 8px; font-size: 13px; color: var(--muted); }

.action-row {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line);
}
.action-row .grow { flex: 1; }
.nav-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; justify-content: space-between;
}

.kbd {
  display: inline-block; min-width: 22px; padding: 1px 6px;
  border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; background: var(--bg); color: var(--muted);
  font: 11px/1.4 var(--font-mono);
}

.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: none; align-items: center; justify-content: center;
  z-index: 50; padding: 20px;
}
.modal-mask.open { display: flex; }
.modal {
  background: var(--panel); color: var(--ink);
  border-radius: var(--radius); max-width: 760px; width: 100%;
  max-height: 90vh; overflow: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.modal header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--panel); z-index: 1;
}
.modal h3 { margin: 0; font-size: 16px; }
.modal .body { padding: 16px 18px; line-height: 1.7; }
.modal .body p { margin: 0 0 8px; }
.modal .body table { width: 100%; border-collapse: collapse; font-size: 13px; }
.modal .body th, .modal .body td {
  padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line);
}
.modal .body th { color: var(--muted); font-weight: 600; font-size: 12px; }
.modal footer {
  padding: 12px 18px; border-top: 1px solid var(--line);
  display: flex; justify-content: flex-end; gap: 8px;
  position: sticky; bottom: 0; background: var(--panel);
}
.modal .body svg { max-width: 100%; height: auto; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.stat-cell {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 12px; background: var(--bg);
}
.stat-cell .v { font-size: 22px; font-weight: 700; color: var(--ink); }
.stat-cell .l { font-size: 12px; color: var(--muted); }

.weak-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg); margin: 6px 0;
}
.weak-item .wi-info { font-size: 13px; }
.weak-item .wi-score { font-weight: 700; color: var(--red); }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 999px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: .2s; z-index: 60;
  box-shadow: 0 6px 20px rgba(0,0,0,.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty {
  text-align: center; padding: 60px 20px; color: var(--muted);
}
.empty h2 { color: var(--ink); margin: 0 0 6px; }

.menu-toggle { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  aside {
    position: fixed; top: 0; left: 0; right: 0; height: auto;
    max-height: 80vh; z-index: 30;
    transform: translateY(-100%); transition: transform .25s;
    border-right: 0; border-bottom: 1px solid var(--line);
  }
  aside.open { transform: translateY(0); }
  .menu-toggle { display: inline-flex; }
  main { padding: 14px 14px 60px; }
  .card { padding: 16px; }
  .stem { font-size: 15px; }
}

@media print {
  aside, .toolbar, .action-row, .nav-row, .toast, .modal-mask { display: none !important; }
  body { background: #fff; color: #000; }
  .card { box-shadow: none; border: 0; padding: 0; }
  .answer-box { display: block !important; }
}
</style>
</head>
<body data-theme="light" data-fontsize="md">

<div class="app">

  <aside id="sidebar">
    <div class="brand">
      <span class="dot"></span>
      <span>计算机网络 · 刷题</span>
      <span class="ver">v2</span>
    </div>

    <div class="session-pill">
      <span>本场</span>
      <strong id="sessionMeta">— 题</strong>
    </div>
    <div class="due-pill" id="duePill" title="点击开始今日复习">
      <span>📅 今日复习</span>
      <strong id="dueCount">0</strong>
    </div>

    <div class="section-title">刷题模式</div>
    <div class="mode-grid" id="modeGrid">
      <button class="mode-btn active" data-mode="sequential">顺序练习<small>按原题号</small></button>
      <button class="mode-btn" data-mode="random">随机练习<small>乱序无限</small></button>
      <button class="mode-btn" data-mode="wrong">错题重练<small>自动收集</small></button>
      <button class="mode-btn" data-mode="fav">收藏复习<small>★ 标记</small></button>
      <button class="mode-btn" data-mode="category">专项突破<small>按知识点</small></button>
      <button class="mode-btn" data-mode="srs">SRS 复习<small>间隔重复</small></button>
      <button class="mode-btn" data-mode="exam">模拟考试<small>计时评分</small></button>
    </div>

    <div class="section-title">筛选 / 搜索</div>
    <div class="filter-row">
      <select id="filterType"></select>
      <select id="filterCat"></select>
    </div>
    <div class="filter-row" style="grid-template-columns: 1fr; margin-top: 6px;">
      <input id="searchInput" type="search" placeholder="搜题干 / 选项 / 答案 / qN...">
    </div>

    <div class="section-title">进度</div>
    <div class="progress"><span id="progressBar"></span></div>
    <div class="meter">
      <span><strong id="doneCount">0</strong> / <span id="totalCount">0</span></span>
      <span>正确率 <strong id="accRate">—</strong></span>
    </div>

    <div class="section-title">题号导航 <small style="font-size:10px;color:var(--muted);">(原号 · qN)</small></div>
    <div class="qnav" id="qnav"></div>
    <div class="legend">
      <span><i class="lg-ok"></i>正确</span>
      <span><i class="lg-bad"></i>错误</span>
      <span><i class="lg-due"></i>SRS到期</span>
      <span><i class="lg-fav"></i>收藏</span>
    </div>

    <div class="side-actions">
      <button id="openStats">📊 统计</button>
      <button id="openWeak">🎯 薄弱点</button>
      <button id="openWrongs">❌ 错题</button>
      <button id="openFavs">★ 收藏</button>
      <button id="openImport">📥 导入</button>
      <button id="openHelp">⌨ 帮助</button>
      <button id="openSettings">⚙ 设置</button>
      <button id="resetAll" class="danger">重置全部</button>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="group">
        <button id="menuToggle" class="menu-toggle icon-btn" aria-label="菜单">☰</button>
        <span class="info">
          <span class="tag" id="modeTag">顺序练习</span>
          <span class="tag" id="catTag">—</span>
          <span class="tag" id="filterTag">—</span>
        </span>
      </div>
      <div class="group">
        <span class="info">第 <strong id="curIdx">1</strong> / <strong id="curTotal">1</strong> 题</span>
        <span class="info" id="timerWrap" hidden>⏱ <strong id="timer">00:00</strong></span>
        <button id="themeBtn" class="icon-btn" title="切换主题">🌗</button>
        <button id="fontBtn" class="icon-btn" title="字号">A↕</button>
      </div>
    </div>

    <div id="qArea"></div>

    <div class="nav-row" id="navRow">
      <button id="prevBtn">← 上一题 <span class="kbd">←</span></button>
      <div>
        <button id="favBtn" class="ghost">★ 收藏 <span class="kbd">F</span></button>
        <button id="reviewBtn" class="ghost">! 待复习 <span class="kbd">R</span></button>
        <button id="showAnsBtn">显示答案 <span class="kbd">Space</span></button>
      </div>
      <button id="nextBtn" class="primary">下一题 → <span class="kbd">→</span></button>
    </div>
  </main>
</div>

<div class="modal-mask" id="mask">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <header>
      <h3 id="modalTitle">标题</h3>
      <button class="icon-btn ghost" data-close>✕</button>
    </header>
    <div class="body" id="modalBody"></div>
    <footer id="modalFooter"></footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>

</body>
</html>
